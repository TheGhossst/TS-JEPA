# Experiment overlay for the corrected-DP-teacher dataset (`data_dp_fixed`).
# Inherits model/hparams from ts_jepa_baseline.yaml, then overrides actor
# training for closed-loop results (not paper Table III).
_base: ts_jepa_baseline.yaml

plan:
  enforce: false
  mode: results

paths:
  data_root: data_dp_fixed
  runs_root: runs
  ts_jepa_dirname: ts_jepa_dp_fixed
  semantic_actor_dirname: semantic_actor_dp_fixed

# Offline BC of the DP teacher shrinks toward the mean (≈60% of u*=0) and
# early-stops at epoch 1. These settings force large-force recovery and then
# refine with on-policy LQR DAgger so Eq. (28) can go above zero.
semantic_actor:
  architecture:
    dropout: 0.05
    layernorm: true
    output_init_scale: 8.0
  optimizer:
    learning_rate: 0.001
    batch_size: 128
    weight_decay: 0.05
  loss: Huber
  huber_beta: 4.0
  large_force_weight: 10.0
  std_match_weight: 0.5
  grad_clip_norm: 1.0
  lr_schedule: cosine
  lr_warmup_epochs: 5
  early_stopping:
    patience: 60
    val_fraction: 0.15
    min_epochs: 40
    split: shuffled_trajectories
  dagger:
    enabled: true
    expert: lqr
    rounds: 6
    rollouts_per_round: 24
    epochs_per_round: 15
    beta_start: 0.9
    beta_decay: 0.85
    mix_offline: false
    mix_mode: convex
    checkpoint_selection: last
    round_selection: best_closed_loop
    run_dirname: semantic_actor_dp_fixed_dagger

# 100 stored decisions × 1 ms = 100 ms, which cannot enter |x|,|θ|≤0.05 from
# init_noise=0.35 (even oracle LQR scores ~0). Hold each command 20 ms so a
# 100-step Eq. (28) rollout is 2 s — same wall-clock as the working overlay.
#
# Closed-loop uses Observer-LQR (decode (x,θ) from z, α-β velocities, discrete
# LQR). The z→u MLP + Pφ miss path scores ~0 under receive-every-Kp even when
# full-receive Eq. (28) is > 0. Offline actor NMAE still evaluates Cε.
#
# Receive-every-15 (300 ms at 20 ms hold) is past a cliff: even oracle (x,θ)
# Observer-LQR scores ~0.004. Every 8 steps (160 ms) still drops 7/8 packets
# and oracle scores ~0.5. Kp remains 15 for the JEPA predictor.
evaluation:
  control_hold_steps: 20
  closed_loop_controller: observer_lqr
  stability_receive_every: 8
  observer_lqr:
    decoder: linear
    alpha: 0.5
    beta: 0.3
