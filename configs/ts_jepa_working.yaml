# Working (non-paper) overlay. Does not claim IEEE headline numbers.
# Paper-faithful baseline remains configs/ts_jepa_baseline.yaml.
_base: ts_jepa_baseline.yaml

plan:
  enforce: false
  mode: working

paths:
  data_root: data_working
  runs_root: runs
  ts_jepa_dirname: ts_jepa_working
  semantic_actor_dirname: semantic_actor_working

simulation:
  observation_stride_steps: 20  # 20 ms stored / control period; physics dt stays 0.001

dataset_generation:
  observation_stride_steps: 20

control_teacher:
  dp_substeps: 20  # one Bellman decision = one stored step (20 ms)

environment:
  jepa_observation: kappa_stack
  context_tensor_shape: [6, 64, 128]

temporal:
  context_frames: "[x_{k-1}, x_k]"  # κ=2 channel-concat into Ψ

ts_jepa:
  encoder:
    l2_normalize: false  # cosine still unit-normalizes inside the loss
  predictor:
    l2_normalize_output: false
    command_scale: 1.0
    # Concat-then-BN drowned u even with gain 16. FiLM modulates BN'd z-features.
    conditioning: film
  optimizer:
    type: AdamW
    learning_rate: 0.0003  # 1e-3 overshot after warmup; EMA target lagged and cosine worsened
    lr_warmup_epochs: 5
    weight_decay: 0.0004
    momentum: 0.0
  loss:
    paper_objective: cosine_similarity_alignment
    implementation: negative_mean_cosine_similarity
    vicreg_variance_weight: 25.0
    # Standardized cov ~1.1; ν=5 made 5*cov ≈ 5.6 drown cosine (~0.7) and EMA lagged.
    vicreg_covariance_weight: 1.0
    vicreg_gamma: 1.0
    vicreg_covariance_standardize: true
    # Cosine can ignore u when teacher_dp is collinear with z. Penalize high
    # cosine between P(z, u_a) and P(z, u_b). teacher_pair uses u vs -u;
    # broad_range samples the actuator range in normalized space (not the ±20 gate).
    command_contrast_weight: 1.0
    command_contrast_margin: 0.05
    command_contrast_sampling: both
  training_procedure:
    steps:
      - context_encoding
      - target_encoding_stop_gradient
      - autoregressive_prediction
      - jepa_loss
      - adamw_update_theta_phi
      - ema_update_target

evaluation:
  working_gates:
    predictor_cosine_plus20_minus20_max: 0.95
    predictor_l2_plus20_minus20_min: 0.2
    encoder_effective_rank_min: 8.0
    actor_must_beat_mean_command: true
    closed_loop_must_beat_hold_and_zero: true
    closed_loop_seeds: [100, 101, 102]
